# MineUX desktop - hyprland.conf
#
# The desktop's window manager, configured the way Hyprland is. Saved changes apply
# straight away (the file is watched); `hyprctl reload` forces it and `hyprctl configerrors`
# says what it could not read. `hyprctl keyword <key> <value>` changes a value until the
# game closes, without touching this file.
#
# SUPER is the client's own window manager key (Alt unless the `super` command says
# otherwise), not the Windows key, which Windows keeps for itself.

$mainMod = SUPER

general {
    # Half the gap between two windows, and the gap between a window and the edge.
    gaps_in = 3
    gaps_out = 6
    border_size = 1

    # One colour, or several and an angle for a gradient.
    col.active_border = rgba(efc648ee) rgba(ff8c42ee) 45deg
    col.inactive_border = rgba(ffffff38)

    # columns: columns side by side, any number of windows each ($mainMod+J turns them into rows).
    # dwindle: each new window splits the focused one in two ($mainMod+J flips that split).
    layout = columns
}

decoration {
    # Darken the windows that do not have focus.
    dim_inactive = false
    dim_strength = 0.15
    # How much the desk the special workspace first drops over ($mainMod+S) is darkened.
    dim_special = 0.3
}

animations {
    enabled = true

    #        name,         x0,   y0,   x1,   y1
    bezier = easeOutQuint, 0.23, 1,    0.32, 1
    bezier = almostLinear, 0.5,  0.5,  0.75, 1
    bezier = quick,        0.15, 0,    0.1,  1

    # animation = name, on, speed (in 100ms), curve [, style]
    animation = global,           1, 10,   default
    animation = windows,          1, 4.79, easeOutQuint
    animation = windowsIn,        1, 4.1,  easeOutQuint, popin 87%
    animation = windowsOut,       1, 1.49, linear,       popin 87%
    animation = fadeIn,           1, 1.73, almostLinear
    animation = fadeOut,          1, 1.46, almostLinear
    animation = border,           1, 5.39, easeOutQuint
    # A rotating gradient on the focused window: one turn every 30 x 100ms. 0 turns it off.
    animation = borderangle,      1, 30,   linear,       loop
    # slide, slidevert, fade, or slidefade 20% / slidefadevert 20% (a fade here goes through
    # dark: what a window draws cannot be made see-through).
    animation = workspaces,       1, 3.5,  easeOutQuint, slide
    # slidevert drops it from the top; fade has it appear in place.
    animation = specialWorkspace, 1, 3,    easeOutQuint, slidevert
}

dwindle {
    # Keep each split's direction once made, instead of choosing it by the space's shape.
    preserve_split = false
    # Where a new window goes: 0 the side the cursor is on, 1 left/top, 2 right/bottom.
    force_split = 0
}

group {
    col.border_active = rgba(5af78eee)
    col.border_inactive = rgba(5af78e40)
}

# bind = MODS, key, dispatcher, argument
# Keys: letters, digits, space, Return, KP_Enter, Tab, left/right/up/down, bracketleft, F1..F12,
# mouse_down and mouse_up (the scroll wheel). Mods: SUPER SHIFT CTRL ALT.
# `hyprctl binds` lists them; `hyprctl dispatch <dispatcher> <argument>` runs one.
# A bind fires once a press; a binde line repeats while its keys are held, e.g.
#   binde = $mainMod SHIFT CTRL, right, resizeactive, 20 0

bind = $mainMod, space, exec, muxsh
bind = $mainMod, Return, exec, muxsh
bind = $mainMod, KP_Enter, exec, muxsh
bind = $mainMod, Q, killactive
bind = $mainMod, F, togglefloating
bind = $mainMod, M, windowmode, toggle
bind = $mainMod, P, pin
bind = $mainMod, J, togglesplit
bind = $mainMod, N, cyclenext

# The focused window less (K) or more (L) see-through, held to keep going; pinned windows keep
# it over the game, and there the keys fade them too. A level works as well: opacity, 0.6
binde = $mainMod, K, opacity, -0.05
binde = $mainMod, L, opacity, +0.05

# Groups: windows stacked as tabs in one tile.
bind = $mainMod, G, togglegroup
bind = $mainMod SHIFT, G, moveoutofgroup
bind = $mainMod, bracketright, changegroupactive, f
bind = $mainMod, bracketleft, changegroupactive, b

# The special workspace (a scratchpad): made the first time it is asked for, then a tab in the bar like any other.
bind = $mainMod, S, togglespecialworkspace
bind = $mainMod SHIFT, S, movetoworkspace, special

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod CTRL, left, moveintogroup, l
bind = $mainMod CTRL, right, moveintogroup, r
bind = $mainMod CTRL, up, moveintogroup, u
bind = $mainMod CTRL, down, moveintogroup, d

# The workspace binds work in game too, with the desktop closed. While SUPER is held the
# number keys switch workstation instead of changing the hotbar slot.
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Send the focused window to a workstation and follow it...
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# ...or send it and stay.
bind = $mainMod CTRL, 1, movetoworkspacesilent, 1
bind = $mainMod CTRL, 2, movetoworkspacesilent, 2
bind = $mainMod CTRL, 3, movetoworkspacesilent, 3
bind = $mainMod CTRL, 4, movetoworkspacesilent, 4
bind = $mainMod CTRL, 5, movetoworkspacesilent, 5
bind = $mainMod CTRL, 6, movetoworkspacesilent, 6
bind = $mainMod CTRL, 7, movetoworkspacesilent, 7
bind = $mainMod CTRL, 8, movetoworkspacesilent, 8
bind = $mainMod CTRL, 9, movetoworkspacesilent, 9

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
